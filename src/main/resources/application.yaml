spring:
  application:
    name: myJavaApp

  datasource:
    url: jdbc:postgresql://localhost:5432/localJava
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate      # was: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Needed for browser auto-refresh in Step 5.
  # In Spring Boot 4 this is OFF by default.
  devtools:
    livereload:
      enabled: true

server:
  port: 8080
