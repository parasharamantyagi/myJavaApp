spring:
  application:
    name: myJavaApp

  datasource:
    url: jdbc:postgresql://localhost:5432/localJava
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate      # was: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The pre-existing `question` table (created by the old ddl-auto: update)
    # makes `public` a non-empty schema, which Flyway refuses to migrate without
    # a baseline. Baseline at 0 so V1 and every later migration still run.
    baseline-on-migrate: true
    baseline-version: 0

  # Needed for browser auto-refresh in Step 5.
  # In Spring Boot 4 this is OFF by default.
  devtools:
    livereload:
      enabled: true

server:
  port: 8080
